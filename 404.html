<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="InkDen page not found.">

    <title>404 | InkDen</title>

    <link rel="stylesheet" href="css/404.css">
</head>

<body>

    <main class="error-page">

        <div class="error-shape error-shape-one"></div>
        <div class="error-shape error-shape-two"></div>
        <div class="error-shape error-shape-three"></div>

        <section class="error-content">

            <span class="error-eyebrow">
                PAGE NOT FOUND
            </span>

            <div class="error-number">
                404
            </div>

            <h1>
                This chapter is
                <em>missing.</em>
            </h1>

            <p class="error-text">
                The page you were looking for could not be found.
                It may have been moved, renamed, or is no longer available.
                Let’s guide you back to your InkDen library.
            </p>

            <div class="error-actions">

                <a href="index.html" class="btn btn-primary">
                    Back to Home
                </a>

                <a href="portfolio.html" class="btn btn-secondary">
                    Explore Portfolio
                </a>

            </div>

        </section>

    </main>

</body>

</html>
