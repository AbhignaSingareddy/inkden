<!doctype html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="InkDen project enquiry form.">
     <link rel="icon" type="image/png" href="images/ink-den-emblem.png">
    <title>Project Enquiry | InkDen</title>
    <script src="js/theme-init.js"></script>

    <link rel="icon" type="image/png" href="images/ink-den-emblem.png">

    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/enquiry.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
</head>

<body class="enquiry-body">

    <main class="enquiry-page">

        <div class="enquiry-topbar">

            <button
                class="icon-btn"
                data-theme-toggle
                aria-label="Toggle dark mode"
                type="button"
            >
                <i data-lucide="moon"></i>
            </button>

            <button
                class="icon-btn"
                data-rtl-toggle
                aria-label="Switch RTL / LTR"
                type="button"
            >
                <i data-lucide="arrow-left-right"></i>
            </button>

        </div>


        <div class="enquiry-card">

            <!-- InkDen Logo -->
            <a
                href="index.html"
                class="enquiry-brand"
                aria-label="InkDen Home"
            >

                <img
                    src="images/ink-den-emblem.png"
                    alt="InkDen logo"
                >

                <span class="enquiry-brand-name">
                    <span class="brand-ink">Ink</span><span class="brand-den">Den</span>
                </span>

            </a>


            <!-- Header -->
            <div class="section-header center">

                <span class="eyebrow">
                    Private project brief
                </span>

                <h1>
                    Let’s plan a room made for your books.
                </h1>

                <p class="lead">
                    A focused form for library, bookshelf and reading-space
                    projects. Your answers help us understand the room before
                    the first conversation.
                </p>

            </div>


            <!-- Enquiry Form -->
            <form data-consultation-form>

                <div class="form-grid">

                    <div class="form-field">

                        <label for="enq-name">
                            Your name
                        </label>

                        <input
                            id="enq-name"
                            type="text"
                            required
                            placeholder="Name"
                        >

                    </div>


                    <div class="form-field">

                        <label for="enq-email">
                            Email address
                        </label>

                        <input
                            id="enq-email"
                            type="email"
                            required
                            placeholder="you@example.com"
                        >

                    </div>


                    <div class="form-field">

                        <label for="enq-phone">
                            Phone number
                        </label>

                        <input
                            id="enq-phone"
                            type="tel"
                            required
                            placeholder="Phone"
                        >

                    </div>


                    <div class="form-field">

                        <label for="enq-type">
                            Project type
                        </label>

                        <select id="enq-type">

                            <option>
                                Home library
                            </option>

                            <option>
                                Reading room
                            </option>

                            <option>
                                Study / office
                            </option>

                            <option>
                                Bookshelf wall
                            </option>

                            <option>
                                Full-room redesign
                            </option>

                        </select>

                    </div>


                    <div class="form-field">

                        <label for="enq-size">
                            Room size
                        </label>

                        <input
                            id="enq-size"
                            type="text"
                            placeholder="e.g. 12 × 14 ft"
                        >

                    </div>


                    <div class="form-field">

                        <label for="enq-timeline">
                            Timeline
                        </label>

                        <select id="enq-timeline">

                            <option>
                                Exploring ideas
                            </option>

                            <option>
                                Within 1–3 months
                            </option>

                            <option>
                                Within 3–6 months
                            </option>

                            <option>
                                6+ months
                            </option>

                        </select>

                    </div>


                    <div class="form-field full">

                        <label for="enq-style">
                            Style &amp; material direction
                        </label>

                        <input
                            id="enq-style"
                            type="text"
                            placeholder="Warm wood, contemporary, classic, minimal..."
                        >

                    </div>


                    <div class="form-field full">

                        <label for="enq-message">
                            Project brief
                        </label>

                        <textarea
                            id="enq-message"
                            required
                            placeholder="Tell us about the room, books, storage, lighting and anything you already know."
                        ></textarea>

                    </div>


                    <div class="form-field full">

                        <button
                            class="btn btn-secondary"
                            type="submit"
                        >
                            Send project enquiry

                            <i data-lucide="send"></i>

                        </button>

                        <div
                            class="form-message"
                            data-form-message
                        ></div>

                    </div>

                </div>

            </form>

        </div>

    </main>


    <script src="https://unpkg.com/lucide@latest"></script>
<script src="js/main.js"></script>

</body>

</html>
