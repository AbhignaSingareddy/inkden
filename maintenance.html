<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="InkDen is temporarily offline while we refine our experience."
    >

    <link
        rel="icon"
        type="image/png"
        href="images/ink-den-emblem.png"
    >

    <title>Maintenance | InkDen</title>


    <!-- GOOGLE FONTS -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- LUCIDE ICONS -->

    <script src="https://unpkg.com/lucide@latest"></script>


    <!-- SHARED CSS -->

    <link
        rel="stylesheet"
        href="css/shared.css"
    >


    <!-- MAINTENANCE CSS -->

    <link
        rel="stylesheet"
        href="css/maintenance.css"
    >


    <!-- THEME INIT -->

    <script src="js/theme-init.js"></script>

</head>


<body id="top">


    <!-- =====================================================
         MAINTENANCE PAGE CONTROLS
    ====================================================== -->

    <div class="maintenance-controls">

        <!-- DARK MODE -->

        <button
            class="maintenance-icon-btn"
            type="button"
            data-theme-toggle
            aria-label="Toggle dark mode"
            title="Toggle dark mode"
        >
            <i data-lucide="moon"></i>
        </button>


        <!-- RTL / LTR -->

        <button
            class="maintenance-icon-btn"
            type="button"
            data-rtl-toggle
            aria-label="Toggle RTL"
            title="Toggle RTL"
        >
            <i data-lucide="arrow-left-right"></i>
        </button>

    </div>


    <!-- =====================================================
         CENTER LOGO
    ====================================================== -->

    <div class="maintenance-top-logo">

        <a
            href="index.html"
            aria-label="InkDen Home"
        >

            <img
                src="images/ink-den-emblem.png"
                alt="InkDen logo"
            >

            <span class="brand-name">

                <span class="brand-ink">Ink</span><span class="brand-den">Den</span>

            </span>

        </a>

    </div>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>


        <!-- =================================================
             MAINTENANCE HERO
        ================================================== -->

        <section class="maintenance-hero">

            <div class="maintenance-content">


                <!-- EYEBROW -->

                <span class="maintenance-eyebrow">
                    TEMPORARILY OFFLINE
                </span>


                <!-- HEADING -->

                <h1>

                    We'll be back soon.

                    <em>
                        Something beautiful is coming.
                    </em>

                </h1>


                <!-- DESCRIPTION -->

                <p>
                    We're giving InkDen a little refinement.
                    We'll be back shortly with a more thoughtful
                    experience.
                </p>


                <!-- BUTTON -->

                <div class="maintenance-actions">

                    <a
                        href="index.html"
                        class="maintenance-button"
                    >

                        <span>
                            Back to Home
                        </span>

                        <i data-lucide="arrow-right"></i>

                    </a>

                </div>


            </div>

        </section>

    </main>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="js/main.js"></script>


    <script>

        if (window.lucide) {

            lucide.createIcons();

        }

    </script>


</body>

</html>
